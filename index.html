

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Page 1</title>

<style>
body{
font-family:Arial,sans-serif;
background:#eaf3ff;
margin:0;
padding:20px;
}

.box{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
color:#0066cc;
}

input{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#007bff;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#0056b3;
}
</style>

</head>

<body>

<div class="box">

<h2>Page 1 Entry</h2>

<input type="text" id="name" placeholder="Name">

<input type="text" id="address" placeholder="Address">

<input type="number" id="tk" placeholder="Tk">

<button onclick="saveData()">Save</button>

</div>

<script>

function saveData(){

let name=document.getElementById("name").value.trim();
let address=document.getElementById("address").value.trim();
let tk=document.getElementById("tk").value.trim();

if(name=="" || address=="" || tk==""){
alert("সব তথ্য লিখুন");
return;
}

let data=JSON.parse(localStorage.getItem("page1_data"))||[];

data.push({
name:name,
address:address,
tk:tk,
date:new Date().toLocaleString()
});

localStorage.setItem("page1_data",JSON.stringify(data));

document.getElementById("name").value="";
document.getElementById("address").value="";
document.getElementById("tk").value="";

window.location.href="file:///C:/Users/shahi/Desktop/pagesave.html";

}
</script>
<button
style="background-color:darkblue; color:white; 
padding:12px 25px; border:none;
 border-radius:8px; 
 font-size:18px; cursor:pointer;"
onclick="window.location.href='https://shahriarfoysalsad-design.github.io/Save-Data/'">
View Save Data
</button>
</body>
</html>
