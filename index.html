<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eaf4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#0066cc;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">

<h2>Data Entry</h2>

<input type="text" id="name" placeholder="Name">

<input type="text" id="when" placeholder="When">

<input type="number" id="tk" placeholder="Tk">

<button onclick="saveData()">Save</button>

</div>

<script>

function saveData(){

let name=document.getElementById("name").value.trim();
let when=document.getElementById("when").value.trim();
let tk=document.getElementById("tk").value.trim();

if(name=="" || when=="" || tk==""){
    alert("Complete all data");
    return;
}

let data=JSON.parse(localStorage.getItem("page1_data")) || [];

data.push({
    name:name,
    when:when,
    tk:tk,
    date:new Date().toLocaleString()
});

localStorage.setItem("page1_data",JSON.stringify(data));

window.location.href="page1save.html";

}

</script>

</body>
</html>
